name: Docker Build and Push

# Trigger only on push to week02 branch
on:
  push:
    branches:
      - week02

# Environment variables
env:
  DOCKER_IMAGE: liushuruinu/cs6620-app
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (advanced build features)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            # Tag with branch name
            type=ref,event=branch
            # Tag with commit SHA (short form)
            type=sha,prefix={{branch}}-,format=short
            # Tag as 'latest' for week02 branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/week02' }}
          labels: |
            # OCI standard labels
            org.opencontainers.image.title=CS6620 Audio Labeling App
            org.opencontainers.image.description=Flask-based audio transcription labeling system
            org.opencontainers.image.vendor=Northeastern University
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.documentation=${{ github.event.repository.html_url }}/blob/week02/README.md
            # GitHub Actions build metadata
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}
            build.actor=${{ github.actor }}
            build.event=${{ github.event_name }}
            build.ref=${{ github.ref }}
            build.commit_sha=${{ github.sha }}
            build.repo=${{ github.repository }}

      # Step 5: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      # Step 6: Display image information
      - name: Image digest and metadata
        run: |
          echo "✅ Image pushed successfully!"
          echo ""
          echo "📦 Image Information:"
          echo "Repository: ${{ env.DOCKER_IMAGE }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo ""
          echo "🏷️  Build Metadata:"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo ""
          echo "🚀 Pull command:"
          echo "docker pull ${{ env.DOCKER_IMAGE }}:latest"
          echo ""
          echo "🔍 Inspect labels:"
          echo "docker inspect ${{ env.DOCKER_IMAGE }}:latest --format='{{json .Config.Labels}}' | jq"

  # -------------------------------------------------------
  # NEW: Deployment job — runs after build-and-push succeeds
  # -------------------------------------------------------
  deploy:
    name: Deploy to EC2 via SSM
    needs: build-and-push        # Only runs if build job succeeds
    runs-on: ubuntu-latest

    steps:
      # Step 1: Configure AWS credentials
      # Requires these GitHub Secrets to be set:
      #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
      #   AWS_SESSION_TOKEN (Learner Lab requires this),
      #   AWS_REGION
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 2: Send deployment command to EC2 via SSM
      # Requires this GitHub Secret:
      #   EC2_INSTANCE_ID — your instance ID (e.g. i-0f6b4831c128c1c38)
      #   DOCKER_USERNAME — your Docker Hub username
      - name: Deploy to EC2 via SSM Run Command
        id: ssm_deploy
        run: |
          # Send shell commands to EC2 through SSM — no SSH needed
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy cs6620-app from GitHub Actions run #${{ github.run_number }}" \
            --parameters 'commands=[
              "echo \"🚀 Starting deployment of cs6620-app...\"",
              "docker pull ${{ secrets.DOCKER_USERNAME }}/cs6620-app:latest",
              "docker stop cs6620-app || true",
              "docker rm cs6620-app || true",
              "docker run -d -p 80:5000 --name cs6620-app --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/cs6620-app:latest",
              "echo \"✅ Deployment complete!\"",
              "docker ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      # Step 3 (Optional): Wait and verify the command succeeded
      - name: Verify deployment success
        run: |
          echo "Waiting 20 seconds for deployment to complete..."
          sleep 20

          # Check the status of the SSM command we sent
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm_deploy.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment succeeded!"
          else
            echo "❌ Deployment status: $STATUS — check AWS Systems Manager > Run Command for logs"
            exit 1
          fi